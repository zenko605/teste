<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      background: #f0f2f5;
    }
    form {
      width: 100%;
      max-width: 320px;
      padding: 24px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    h1 {
      margin: 0 0 20px;
      font-size: 22px;
      text-align: center;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 4px;
      background: #1877f2;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover { background: #145dbf; }
  </style>
</head>
<body>
  <form action="#" method="post">
    <h1>Login</h1>

    <label for="usuario">Usuário</label>
    <input type="text" id="usuario" name="usuario" autocomplete="username" required>

    <label for="senha">Senha</label>
    <input type="password" id="senha" name="senha" autocomplete="current-password" required>

    <button type="submit">Entrar</button>
  </form>
</body>
</html>
